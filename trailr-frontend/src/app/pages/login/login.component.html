<div class="login-container">

  <h2>Trailr Login</h2>

  <div class="form-group">

    <label>Username:</label>

    <input
      type="text"
      [(ngModel)]="username">

  </div>

  <div class="form-group">

    <label>Password:</label>

    <input
      type="password"
      [(ngModel)]="password">

  </div>

  <button type="button" (click)="login()">
    Login
  </button>

  <p style="color: red;" *ngIf="errorMessage">
    {{ errorMessage }}
  </p>

  <hr>

  <p>
    Demo Login:
  </p>

  <p>
    Username: admin
  </p>

  <p>
    Password: trailr123
  </p>

</div>
