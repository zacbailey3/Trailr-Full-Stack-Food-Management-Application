<div class="container">

<h2>Trailr Menu Items</h2>

<h3>Add Menu Item</h3>

<form (ngSubmit)="addMenuItem()">

  <div class="form-group">
    <label>Item Name:</label>
    <input type="text" name="itemName" [(ngModel)]="newMenuItem.itemName">
  </div>

  <div class="form-group">
    <label>Category:</label>
    <input type="text" name="category" [(ngModel)]="newMenuItem.category">
  </div>

  <div class="form-group">
    <label>Price:</label>
    <input type="number" name="price" [(ngModel)]="newMenuItem.price">
  </div>

  <div class="form-group">
    <label>Available:</label>
    <input type="checkbox" name="available" [(ngModel)]="newMenuItem.available">
  </div>

  <br><br>

  <button type="submit">Add Menu Item</button>

</form>

<p style="color: red;" *ngIf="errorMessage">{{ errorMessage }}</p>

<hr>

<h3>Search Menu Items</h3>

<input
  type="text"
  [(ngModel)]="searchTerm"
  placeholder="Search by item name">

<button type="button" (click)="searchMenuItems()">
  Search
</button>

<button type="button" (click)="loadMenuItems()">
  Reset
</button>

<hr>

<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>Item Name</th>
    <th>Category</th>
    <th>Price</th>
    <th>Available</th>
    <th>Actions</th>
  </tr>
  </thead>

  <tbody>
  <tr *ngFor="let item of menuItems">
    <td>{{ item.id }}</td>
    <td>{{ item.itemName }}</td>
    <td>{{ item.category }}</td>
    <td>{{ item.price }}</td>
    <td>{{ item.available ? 'Yes' : 'No' }}</td>

    <td>
      <button type="button" (click)="editMenuItem(item)">
        Edit
      </button>
      <button type="button" (click)="deleteMenuItem(item.id)">
        Delete
      </button>
    </td>
  </tr>
  </tbody>
</table>

</div>
