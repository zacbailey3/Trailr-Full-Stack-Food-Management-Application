<div class="container">

  <h2>Reports Page</h2>

  <p *ngIf="!report && !errorMessage">Loading report...</p>

  <p style="color: red;" *ngIf="errorMessage">
    {{ errorMessage }}
  </p>

  <div *ngIf="report">
    <h2>{{ report.title }}</h2>
    <p>Generated At: {{ report.generatedAt }}</p>

    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Item Name</th>
        <th>Category</th>
        <th>Price</th>
        <th>Available</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let item of report.menuItems">
        <td>{{ item.id }}</td>
        <td>{{ item.itemName }}</td>
        <td>{{ item.category }}</td>
        <td>{{ item.price }}</td>
        <td>{{ item.available ? 'Yes' : 'No' }}</td>
      </tr>
      </tbody>
    </table>
  </div>

</div>
